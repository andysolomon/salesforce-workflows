name: Benchmark Salesforce CLI setup

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/benchmark-salesforce-cli.yml

permissions: {}

jobs:
  benchmark:
    name: CLI setup / ${{ matrix.method }} / ${{ matrix.sample }}
    runs-on: ubuntu-latest
    # The empty image runs the npm baseline directly on the hosted VM.
    container:
      image: ${{ matrix.image || '' }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        method: [npm, slim]
        sample: [1, 2, 3, 4, 5]
        include:
          - method: slim
            # salesforce/cli:2.159.7-slim
            image: docker.io/salesforce/cli@sha256:14e83ce5d8d6357c5197419a857b5e51c978eead5491a996f502aa52992d8019
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Salesforce CLI
        if: matrix.method == 'npm'
        run: npm install --global @salesforce/cli@2.159.7
      - name: Trust the mounted checkout
        if: matrix.method == 'slim'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Smoke test toolchain without Salesforce credentials
        run: |
          git rev-parse --verify HEAD
          jq --version
          node --version
          node -e 'if (process.versions.node.split(".")[0] !== "24") process.exit(1)'
          npm --version
          sf_version=$(sf --version)
          printf '%s\n' "$sf_version"
          [[ "$sf_version" == '@salesforce/cli/2.159.7 '* ]]
          sf org login jwt --help >/dev/null
          sf org display --help >/dev/null
          sf package install --help >/dev/null
          sf project deploy start --help >/dev/null
          sf project deploy validate --help >/dev/null
          sf project deploy quick --help >/dev/null

  report:
    name: Report CLI setup timings
    needs: benchmark
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Summarize GitHub job timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            > "$RUNNER_TEMP/benchmark-jobs.json"
          python3 - "$RUNNER_TEMP/benchmark-jobs.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from datetime import datetime
          from statistics import median

          def seconds(start, end):
              if not start or not end:
                  return None
              return (datetime.fromisoformat(end) - datetime.fromisoformat(start)).total_seconds()

          def show(value):
              return "—" if value is None else f"{value:g}"

          with open(sys.argv[1], encoding="utf-8") as results:
              jobs = json.load(results)["jobs"]

          print("## Salesforce CLI setup benchmark")
          print()
          print("Times are in seconds. Total uses GitHub's job timestamps.")
          print("Startup ends at checkout and includes the image pull and container creation for slim.")
          print()
          print("| Method | Sample | Result | Startup | Node setup | CLI install | Smoke test | Total |")
          print("| --- | --- | --- | ---: | ---: | ---: | ---: | ---: |")
          totals = {"npm": [], "slim": []}
          for job in sorted(jobs, key=lambda entry: entry["name"]):
              if not job["name"].startswith("CLI setup / "):
                  continue
              _, method, sample = job["name"].split(" / ")
              steps = {step["name"]: step for step in job.get("steps") or [] if step["conclusion"] != "skipped"}
              startup = seconds(job["started_at"], steps.get("Check out repository", {}).get("started_at"))
              timings = [startup]
              for name in ("Set up Node 24", "Install Salesforce CLI", "Smoke test toolchain without Salesforce credentials"):
                  step = steps.get(name, {})
                  timings.append(seconds(step.get("started_at"), step.get("completed_at")))
              total = seconds(job["started_at"], job["completed_at"])
              timings.append(total)
              if job["conclusion"] == "success" and total is not None:
                  totals[method].append(total)
              cells = " | ".join(show(value) for value in timings)
              print(f"| {method} | {sample} | [{job['conclusion']}]({job['html_url']}) | {cells} |")

          print()
          for method, values in totals.items():
              if values:
                  print(f"- **{method}** had {len(values)}/5 successful samples with a median "
                        f"of {median(values):g} s and a range of {min(values):g}–{max(values):g} s.")
              else:
                  print(f"- **{method}** had zero successful samples.")
          PY
