name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check workflows and the example caller
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" \
            | sha256sum --check
          tar -xzf "$archive" actionlint

          cd "$GITHUB_WORKSPACE"
          sed 's|andysolomon/salesforce-workflows/.github/workflows/deploy-org.yml@v1|./.github/workflows/deploy-org.yml|' \
            examples/release.yml > .github/workflows/example-caller.yml
          "$RUNNER_TEMP/actionlint" -color
